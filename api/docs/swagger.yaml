info:
  contact: {}
  description: API for managing SESC departments, users and permissions
  title: SESC Management API
  version: "1.0"
paths:
  /achievement-groups:
    get:
      description: Retrieves all achievement groups
      parameters:
      - description: Bearer JWT token
        in: header
        name: Authorization
        type: string
      - default: false
        description: Show inactive groups
        in: query
        name: show_inactive
        type: boolean
      - description: Search by name
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/api.AchievementGroupResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.UnauthorizedError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/api.ServerError'
      security:
      - BearerAuth: []
      summary: Get all achievement groups
      tags:
      - achievement-groups
    post:
      consumes:
      - application/json
      description: Creates a new achievement group
      parameters:
      - description: Bearer JWT token
        in: header
        name: Authorization
        type: string
      - description: Group details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.CreateAchievementGroupRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/api.AchievementGroupResponse'
        "400":
          description: Invalid request format
          schema:
            $ref: '#/definitions/api.InvalidRequestError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.UnauthorizedError'
        "403":
          description: Forbidden - admin role required
          schema:
            $ref: '#/definitions/api.ForbiddenError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/api.ServerError'
      security:
      - BearerAuth: []
      summary: Create new achievement group
      tags:
      - achievement-groups
  /achievement-groups/{id}:
    patch:
      consumes:
      - application/json
      description: Updates an achievement group
      parameters:
      - description: Bearer JWT token
        in: header
        name: Authorization
        type: string
      - description: Group UUID
        in: path
        name: id
        required: true
        type: string
      - description: Group fields to update
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.PatchAchievementGroupRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.AchievementGroupResponse'
        "400":
