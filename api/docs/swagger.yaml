info:
  contact: {}
  description: API for managing SESC departments, users and permissions
  title: SESC Management API
  version: "1.0"
paths:
  /achievement-groups:
    get:
      description: Retrieves all achievement groups with filtering options
      parameters:
      - description: Bearer JWT token
        in: header
        name: Authorization
        type: string
      - default: false
        description: Show inactive groups
        in: query
        name: show_inactive
        type: boolean
      - description: Search by name
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/respond.AchievementGroup'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/respond.Error'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/respond.Error'
      security:
      - BearerAuth: []
      summary: Get all achievement groups
      tags:
      - achievement-groups
    post:
      consumes:
      - application/json
      description: Creates a new achievement group
      parameters:
      - description: Bearer JWT token
        in: header
        name: Authorization
        type: string
      - description: Group details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/param.CreateAchievementGroupRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/respond.AchievementGroup'
        "400":
          description: Invalid request format
          schema:
            $ref: '#/definitions/respond.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/respond.Error'
        "403":
          description: Forbidden - admin role required
          schema:
            $ref: '#/definitions/respond.Error'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/respond.Error'
      security:
      - BearerAuth: []
      summary: Create new achievement group
      tags:
      - achievement-groups
  /achievement-groups/{id}:
    patch:
      consumes:
      - application/json
      description: Updates an achievement group
      parameters:
      - description: Bearer JWT token
        in: header
        name: Authorization
        type: string
      - description: Group UUID
        in: path
        name: id
        required: true
        type: string
      - description: Group fields to update
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/param.PatchAchievementGroupRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/respond.AchievementGroup'
        "400":
          description: Invalid request format
          schema:
            $ref: '#/definitions/respond.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/respond.Error'
        "403":
          description: Forbidden - admin role required
          schema:
            $ref: '#/definitions/respond.Error'
        "404":
          description: Group not found
          schema:
            $ref: '#/definitions/respond.Error'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/respond.Error'
      security:
      - BearerAuth: []
      summary: Update achievement group
      tags:
      - achievement-groups
  /achievement-templates:
    get:
      description: Retrieves all achievement templates
      parameters:
      - description: Bearer JWT token
        in: header
        name: Authorization
        type: string
      - default: false
        description: Show inactive templates
        in: query
        name: show_inactive
        type: boolean
      - description: Search by name
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/respond.AchievementTemplate'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/respond.Error'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/respond.Error'
      security:
      - BearerAuth: []
      summary: Get all achievement templates
      tags:
      - achievement-templates
    post:
      consumes:
      - application/json
      description: Creates a new achievement template
      parameters:
      - description: Bearer JWT token
        in: header
        name: Authorization
        type: string
      - description: Template details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/param.CreateAchievementTemplateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/respond.AchievementTemplate'
        "400":
          description: Invalid request format
          schema:
            $ref: '#/definitions/respond.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/respond.Error'
        "403":
          description: Forbidden - admin role required
          schema:
            $ref: '#/definitions/respond.Error'
        "404":
          description: Group not found
          schema:
            $ref: '#/definitions/respond.Error'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/respond.Error'
      security:
      - BearerAuth: []
      summary: Create new achievement template
      tags:
      - achievement-templates
  /achievement-templates/{id}:
    patch:
      consumes:
      - application/json
      description: Updates an achievement template
      parameters:
      - description: Bearer JWT token
        in: header
        name: Authorization
        type: string
      - description: Template UUID
        in: path
        name: id
        required: true
        type: string
      - description: Template fields to update
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/param.PatchAchievementTemplateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/respond.AchievementTemplate'
        "400":
          description: Invalid request format
          schema:
            $ref: '#/definitions/respond.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/respond.Error'
        "403":
          description: Forbidden - admin role required
          schema:
            $ref: '#/definitions/respond.Error'
        "404":
          description: Template not found
          schema:
            $ref: '#/definitions/respond.Error'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/respond.Error'
      security:
      - BearerAuth: []
      summary: Update achievement template
      tags:
      - achievement-templates
  /achievements:
    get:
      description: Retrieves all achievements for the current user with pagination
      parameters:
      - description: Bearer JWT token
        in: header
        name: Authorization
        type: string
      - default: 0
        description: Pagination offset
        in: query
        minimum: 0
        name: offset
        type: integer
      - default: 10
        description: Pagination limit
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      - description: User's ID
        in: query
        name: id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/respond.Achievements'
        "400":
          description: Invalid request parameters
          schema:
            $ref: '#/definitions/respond.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/respond.Error'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/respond.Error'
      security:
      - BearerAuth: []
      summary: Get all achievements for the current user
      tags:
      - achievements
    post:
      consumes:
      - application/json
      description: Creates a new achievement for the current user
      parameters:
      - description: Bearer JWT token
        in: header
        name: Authorization
        type: string
      - description: Achievement creation data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/param.CreateAchievementRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/respond.Achievement'
        "400":
          description: Invalid request format
          schema:
            $ref: '#/definitions/respond.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/respond.Error'
        "404":
          description: Template not found
          schema:
            $ref: '#/definitions/respond.Error'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/respond.Error'
      security:
      - BearerAuth: []
      summary: Create a new achievement
      tags:
      - achievements
  /achievements/{id}:
    delete:
      description: Deletes an achievement
      parameters:
      - description: Bearer JWT token
        in: header
        name: Authorization
        type: string
      - description: Achievement UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Invalid UUID format
          schema:
            $ref: '#/definitions/respond.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/respond.Error'
        "404":
          description: Achievement not found
          schema:
            $ref: '#/definitions/respond.Error'
        "409":
          description: Wrong achievement status
          schema:
            $ref: '#/definitions/respond.Error'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/respond.Error'
      security:
      - BearerAuth: []
      summary: Delete an achievement
      tags:
      - achievements
    get:
      description: Retrieves a specific achievement by ID
      parameters:
      - description: Bearer JWT token
        in: header
        name: Authorization
        type: string
      - description: Achievement UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/respond.Achievement'
        "400":
          description: Invalid UUID format
          schema:
            $ref: '#/definitions/respond.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/respond.Error'
        "404":
          description: Achievement not found
          schema:
            $ref: '#/definitions/respond.Error'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/respond.Error'
      security:
      - BearerAuth: []
      summary: Get a specific achievement
      tags:
      - achievements
  /achievements/{id}/documents:
    post:
      consumes:
      - application/json
      description: Adds a document to an achievement
      parameters:
      - description: Bearer JWT token
        in: header
        name: Authorization
        type: string
      - description: Achievement UUID
        in: path
        name: id
        required: true
        type: string
      - description: Document data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/param.AddDocumentRequest'
      produces:
