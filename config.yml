# This file is for LOCAL DEVELOPMENT ONLY
# In production, ALL configuration comes from environment variables (see .kamal/secrets)
#
# To override any value locally, use environment variables with SESC_ prefix:
#   export SESC_DATABASE_ADDRESS="postgres://user:pass@localhost:5432/dbname"
#   export SESC_JWT_SECRET="your-secret"
#   export SESC_MINIO_ACCESS_KEY="your-key"
#   etc.

database:
  type: "postgres"
  # Local dev database (use env var SESC_DATABASE_ADDRESS for custom)
  address: "postgres://pguser:pgpassword@localhost:5432/sesc?sslmode=disable"

http:
  server_address: ":8080"
  read_header_timeout: 300ms
  read_timeout: 10s
  write_timeout: 10s

# For production, set via SESC_JWT_SECRET env variable
jwt_secret: "local-dev-secret-change-in-production"

# For production, use env variables:
# SESC_ADMIN_CREDENTIALS_0_ID
# SESC_ADMIN_CREDENTIALS_0_USERNAME  
# SESC_ADMIN_CREDENTIALS_0_PASSWORD
admin_credentials:
  - id: "f1157f63-65dc-4c3d-bcb2-4d6d55d2e3fd"
    username: "admin"
    password: "admin"  # Local dev only, change in production via env vars

# For production, use env variables:
# SESC_MINIO_ENDPOINT, SESC_MINIO_ACCESS_KEY, SESC_MINIO_SECRET_KEY, etc.
minio:
  endpoint: "localhost:9000"
  access_key: "minioadmin"
  secret_key: "minioadmin"
  use_ssl: false
  bucket_name: "sesc-files"
  base_url: "http://localhost:9000/sesc-files"
