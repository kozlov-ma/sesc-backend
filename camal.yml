# Camal Configuration for SESC Backend
version: '1.0'

# Project configuration
project:
  name: sesc-backend
  description: "SESC Backend Application"
  version: "1.0.0"

# Build configuration
build:
  backend:
    context: .
    dockerfile: Dockerfile
    image: ghcr.io/kozlov-ma/sesc-backend/backend:latest
    registry: ghcr.io
    username: ${{ secrets.GITHUB_ACTOR }}
    password: ${{ secrets.GITHUB_TOKEN }}
  
  frontend:
    context: ./web
    dockerfile: Dockerfile
    image: ghcr.io/kozlov-ma/sesc-backend/frontend:latest
    registry: ghcr.io
    username: ${{ secrets.GITHUB_ACTOR }}
    password: ${{ secrets.GITHUB_TOKEN }}
    build_args:
      NEXT_PUBLIC_API_URL: "https://api.sesc.online"

# Deployment configuration
deploy:
  strategy: rolling
  replicas: 1
  
  # Environment variables
  environment:
    POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
    MINIO_ROOT_USER: ${{ secrets.MINIO_ROOT_USER }}
    MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
  
  # Health checks
  health_check:
    backend:
      path: /health
      port: 8080
      interval: 30s
      timeout: 10s
      retries: 3
  
  # SSL configuration
  ssl:
    provider: letsencrypt
    email: admin@sesc.online
    domains:
      - sesc.online
      - api.sesc.online
      - traefik.sesc.online

# Infrastructure
infrastructure:
  # Database
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: sesc
      POSTGRES_USER: sesc
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    health_check:
      test: ["CMD", "pg_isready", "-U", "sesc"]
      interval: 10s
      retries: 5
  
  # Object Storage
  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: ${{ secrets.MINIO_ROOT_USER }}
      MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    health_check:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      retries: 5
  
  # Reverse Proxy
  traefik:
    image: traefik:v3.0
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_certificates:/certificates
    command:
      - --api.dashboard=true
      - --api.insecure=false
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=traefik
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.email=admin@sesc.online
      - --certificatesresolvers.letsencrypt.acme.storage=/certificates/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https

# Monitoring
monitoring:
  enabled: true
  metrics:
    backend: /metrics
    frontend: /_next/static/chunks/pages/_app.js

# Backup
backup:
  postgres:
    schedule: "0 2 * * *"  # Daily at 2 AM
    retention: 7  # Keep 7 days
  minio:
    schedule: "0 3 * * *"  # Daily at 3 AM
    retention: 7  # Keep 7 days

# Secrets required
secrets:
  - POSTGRES_PASSWORD
  - MINIO_ROOT_USER
  - MINIO_ROOT_PASSWORD
  - GITHUB_TOKEN
  - SSH_HOST
  - SSH_USER
  - SSH_KEY
